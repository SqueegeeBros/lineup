<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SB Lineup">
<title>SB Lineup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--panel:176px;--amber:#FFB800;--green:#2FD27A;--red:#FF5A4E;--cyan:#00C2FF;--gold:#FFD24D;--ink:#0b0f14}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;color:#fff;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.hidden{display:none!important}
.glass{background:rgba(16,22,30,.58);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);border:1px solid rgba(255,255,255,.10)}

/* ---------- camera stage ---------- */
#stage{position:fixed;left:0;right:0;top:0;bottom:var(--panel);overflow:hidden;background:#05070a;border-radius:0 0 26px 26px}
#stage video,#stage .ov{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
#ghost{opacity:.3;pointer-events:none}
#outline{pointer-events:none;filter:drop-shadow(0 0 1px #000) drop-shadow(0 0 1px #000)}
.vig{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.5) 0%,rgba(0,0,0,0) 24%,rgba(0,0,0,0) 78%,rgba(0,0,0,.35) 100%)}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
#flash.on{opacity:.85;transition:none}

#top{position:absolute;top:12px;left:12px;right:12px;z-index:3}
#pill{width:100%;border-radius:20px;padding:11px 14px 11px 11px;display:flex;align-items:center;gap:12px;text-align:left;transition:background .25s}
#pill .ico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none;transition:background .25s}
#pill .txt{min-width:0;flex:1}
#pill .lbl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.55)}
#pill .msg{font-size:17px;font-weight:650;font-weight:600;letter-spacing:-.01em;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pill .chev{color:rgba(255,255,255,.45);flex:none}
#pill .bar{height:4px;border-radius:2px;background:rgba(255,255,255,.15);margin-top:7px;overflow:hidden}
#pill .bar i{display:block;height:100%;width:0;border-radius:2px;background:var(--amber);transition:width .2s,background .2s}
.chips{display:flex;gap:6px;margin-top:8px;justify-content:center}
.chip{border-radius:999px;padding:6px 11px 6px 9px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35);transition:background .2s}
.dot.good{background:var(--green)}.dot.warn{background:var(--amber)}.dot.bad{background:var(--red)}

#level{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none;z-index:2}
#level .ref{position:absolute;left:-150px;width:300px;top:-1px;height:2px}
#level .ref::before,#level .ref::after{content:"";position:absolute;top:0;width:18px;height:2px;background:rgba(255,255,255,.8);border-radius:2px}
#level .ref::before{left:0}#level .ref::after{right:0}
#level .line{position:absolute;left:-125px;top:-1px;width:250px;height:2px;transition:transform .08s linear}
#level .line::before,#level .line::after{content:"";position:absolute;top:0;height:2px;width:92px;border-radius:2px;background:var(--lc,var(--amber));box-shadow:0 0 0 1px rgba(0,0,0,.25)}
#level .line::before{left:0}#level .line::after{right:0}
#level .deg{position:absolute;top:14px;left:0;transform:translateX(-50%);font-size:13px;font-weight:700;color:var(--lc,var(--amber));padding:4px 9px;border-radius:999px;white-space:nowrap}

#brk{position:absolute;pointer-events:none;transition:left .25s,top .25s,width .25s,height .25s;z-index:2}
#brk b{position:absolute;width:22px;height:22px;border-color:#fff;border-style:solid;filter:drop-shadow(0 0 2px rgba(0,0,0,.6))}
#brk.locked b{border-color:var(--cyan)}
#brk .a{left:0;top:0;border-width:2.5px 0 0 2.5px;border-radius:6px 0 0 0}
#brk .b{right:0;top:0;border-width:2.5px 2.5px 0 0;border-radius:0 6px 0 0}
#brk .c{left:0;bottom:0;border-width:0 0 2.5px 2.5px;border-radius:0 0 0 6px}
#brk .d{right:0;bottom:0;border-width:0 2.5px 2.5px 0;border-radius:0 0 6px 0}

#hint{position:absolute;left:0;right:0;bottom:16px;text-align:center;font-size:13px;font-weight:500;color:rgba(255,255,255,.88);text-shadow:0 1px 3px rgba(0,0,0,.8);pointer-events:none;z-index:2}
#lockChip{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px;z-index:3}
#lockChip .x{opacity:.7}
#ghostBtn{position:absolute;right:12px;bottom:12px;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:3}
#ghostBtn span{position:absolute;bottom:-2px;right:-2px;font-size:10px;font-weight:800;background:#fff;color:#000;border-radius:8px;padding:1px 4px}

#camMsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:30px;text-align:center;z-index:4;background:#05070a}
#camMsg .box{max-width:320px}
#camMsg h3{font-size:19px;font-weight:700;margin-bottom:8px}
#camMsg p{font-size:14.5px;color:rgba(255,255,255,.7);line-height:1.45}
#camMsg .btn{margin-top:18px}
.spinner{width:30px;height:30px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:#fff;animation:spin 0.9s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- bottom panel ---------- */
#panel{position:fixed;left:0;right:0;bottom:0;height:var(--panel);padding:0 26px;background:#000}
.modes{display:flex;justify-content:center;gap:8px;margin-top:12px}
.modes button{font-size:13px;font-weight:700;letter-spacing:.09em;color:rgba(255,255,255,.5);padding:6px 10px;border-radius:999px;transition:color .2s,background .2s}
.modes button.on{color:var(--gold);background:rgba(255,210,77,.1)}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.slot{width:68px;display:flex;flex-direction:column;align-items:center}
.stack{position:relative;width:60px;height:60px}
.stack .t{position:absolute;width:52px;height:52px;border-radius:13px;border:2px solid rgba(255,255,255,.92);background:#1a222c center/cover no-repeat}
.stack .t1{left:7px;top:0;transform:rotate(7deg);opacity:.75}
.stack .t2{left:0;top:7px}
.stack.empty .t{border-style:dashed;border-color:rgba(255,255,255,.3);background:none}
.badge{position:absolute;right:-6px;top:-6px;background:var(--cyan);color:#00131d;font-size:12px;font-weight:800;min-width:22px;height:22px;padding:0 5px;border-radius:11px;display:flex;align-items:center;justify-content:center;border:2px solid #000}
.cap{font-size:11px;font-weight:600;color:rgba(255,255,255,.72);margin-top:7px;white-space:nowrap}
#shutter{width:82px;height:82px;border-radius:50%;border:4px solid #fff;display:flex;align-items:center;justify-content:center;transition:border-color .2s,transform .1s}
#shutter i{width:64px;height:64px;border-radius:50%;background:#fff;transition:background .2s,transform .1s}
#shutter:active i{transform:scale(.9)}
#shutter.go{border-color:var(--green)}
#shutter.go i{background:#eafff2}
.round{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative}

/* ---------- sheets ---------- */
#sheetWrap{position:fixed;inset:0;z-index:20}
#sheetWrap .backdrop{position:absolute;inset:0;background:rgba(0,0,0,.45);animation:fade .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:86vh;overflow:auto;border-radius:26px 26px 0 0;padding:10px 20px 28px;background:rgba(18,24,32,.9);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid rgba(255,255,255,.1);animation:up .26s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}}
.grab{width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.25);margin:0 auto 14px}
.sh-title{font-size:20px;font-weight:700;letter-spacing:-.01em}
.sh-sub{font-size:14px;color:rgba(255,255,255,.6);margin-top:3px}
.bubble{display:block;margin:18px auto 10px}
.checks{margin-top:8px}
.check{display:flex;gap:12px;padding:12px 0;border-top:1px solid rgba(255,255,255,.08)}
.check .dot{width:10px;height:10px;margin-top:6px;flex:none}
.check .ct{font-size:15px;font-weight:600}
.check .cd{font-size:13.5px;color:rgba(255,255,255,.65);margin-top:2px;line-height:1.4}
.check .cv{margin-left:auto;font-size:14px;font-weight:700;color:rgba(255,255,255,.85);white-space:nowrap;padding-left:8px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.cell{position:relative;border-radius:14px;overflow:hidden;background:#1a222c;aspect-ratio:3/4}
.cell img{width:100%;height:100%;object-fit:cover;display:block}
.cell .time{position:absolute;left:6px;bottom:6px;font-size:11.5px;font-weight:700;background:rgba(0,0,0,.55);padding:2px 7px;border-radius:999px}
.cell .del{position:absolute;right:5px;top:5px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center}
.grid.two{grid-template-columns:repeat(2,1fr)}
.cell.wide{aspect-ratio:4/3;background:#0b1f33}
.cell.wide img{object-fit:contain}
.empty{padding:30px 10px;text-align:center;color:rgba(255,255,255,.6);font-size:14.5px}
.tipline{font-size:13px;color:rgba(255,255,255,.55);margin-top:14px;line-height:1.45}

/* ---------- full-screen views ---------- */
.view{position:fixed;inset:0;z-index:30;background:#000;display:flex;flex-direction:column;animation:fade .2s}
.vhead{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 6px}
.vhead .title{font-size:16px;font-weight:700}
.icon-btn{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.text-btn{height:40px;padding:0 14px;border-radius:999px;font-weight:700;font-size:15px}
.text-btn.pri{color:var(--gold)}
.cmpArea{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px 14px}
.cmp{position:relative;border-radius:18px;overflow:hidden;touch-action:none;background:#111;max-width:100%;max-height:100%}
.cmp canvas{display:block;width:100%;height:100%}
.cmp #cmpB{position:absolute;inset:0}
.knobline{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:#fff;box-shadow:0 0 6px rgba(0,0,0,.5);pointer-events:none}
.knob{position:absolute;top:50%;left:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:#fff;color:#000;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.4);pointer-events:none}
.tag{position:absolute;top:12px;font-size:11px;font-weight:800;letter-spacing:.1em;padding:5px 9px;border-radius:999px;pointer-events:none}
.tag.l{left:12px}.tag.r{right:12px}
#sideImg{max-width:100%;max-height:100%;border-radius:14px;display:block}
.seg{display:flex;align-self:center;background:rgba(255,255,255,.08);border-radius:999px;padding:3px;margin:10px 0 4px}
.seg button{padding:8px 16px;border-radius:999px;font-size:13.5px;font-weight:600;color:rgba(255,255,255,.65)}
.seg button.on{background:rgba(255,255,255,.16);color:#fff}
.actions{padding:10px 16px 22px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:54px;border-radius:16px;font-size:16.5px;font-weight:700}
.btn.pri{background:#fff;color:#000}
.btn.sec{background:rgba(255,255,255,.1);color:#fff}
.btn2{display:flex;gap:10px;margin-top:10px}
.btn2 .btn{height:48px;font-size:15px}
.adjArea{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px 14px}
#adjCanvas{max-width:100%;max-height:100%;border-radius:16px;touch-action:none;display:block}
.adjCtl{padding:8px 20px 22px}
.ctl{display:flex;align-items:center;gap:12px;margin:10px 0;font-size:14px}
.ctl label{width:64px;color:rgba(255,255,255,.6);font-weight:500}
.ctl input{flex:1;accent-color:#fff}
.ctl .v{width:48px;text-align:right;font-weight:700}

#toast{position:fixed;left:50%;top:calc(50% - 30px);transform:translate(-50%,-50%) scale(.96);background:rgba(16,22,30,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:12px 18px;border-radius:16px;font-size:15px;font-weight:600;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:50;text-align:center;max-width:80vw}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#busy{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:600}
</style>
</head>
<body>

<!-- ================= CAMERA ================= -->
<div id="stage">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="ghost" class="ov hidden"></canvas>
  <canvas id="outline" class="ov hidden"></canvas>
  <div class="vig"></div>

  <div id="brk" class="hidden"><b class="a"></b><b class="b"></b><b class="c"></b><b class="d"></b></div>
  <div id="level" class="hidden"><div class="ref"></div><div class="line" id="lvLine"></div><div class="deg glass" id="lvDeg">0°</div></div>

  <div id="top">
    <button id="pill" class="glass" aria-label="Suggested angle, tap for guide">
      <span class="ico" id="pIco"></span>
      <span class="txt"><span class="lbl" id="pLbl">Suggested angle</span><span class="msg" id="pMsg" style="display:block">Starting camera…</span><span class="bar hidden" id="pBar"><i></i></span></span>
      <svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
    </button>
    <div class="chips">
      <div class="chip glass"><span class="dot" id="c1d"></span><span id="c1">Level</span></div>
      <div class="chip glass"><span class="dot" id="c2d"></span><span id="c2">Framing</span></div>
      <div class="chip glass"><span class="dot" id="c3d"></span><span id="c3">Light</span></div>
    </div>
  </div>

  <div id="hint">Tap anything to lock onto it</div>
  <button id="lockChip" class="glass hidden"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#00C2FF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Locked<span class="x">✕</span></button>
  <button id="ghostBtn" class="glass hidden" aria-label="Ghost overlay"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span id="ghostPct">30%</span></button>

  <div id="flash"></div>
  <div id="camMsg">
    <div class="box"><div class="spinner" id="camSpin"></div><h3 id="camH">Starting camera…</h3><p id="camP"></p>
      <label class="btn sec hidden" id="camFileBtn" for="fileIn">Use a photo instead</label></div>
  </div>
</div>
<input type="file" id="fileIn" accept="image/*" capture="environment" class="hidden">

<div id="panel">
  <div class="modes"><button id="mBefore" class="on">BEFORE</button><button id="mAfter">AFTER</button></div>
  <div class="row">
    <button class="slot" id="stackBtn" aria-label="Photos that need an after">
      <span class="stack empty" id="stack"><span class="t t1" id="st1"></span><span class="t t2" id="st2"></span><span class="badge hidden" id="stBadge">0</span></span>
      <span class="cap" id="stCap">Need after</span>
    </button>
    <button id="shutter" aria-label="Take photo"><i></i></button>
    <button class="slot" id="pairsBtn" aria-label="Finished before and afters">
      <span class="round glass"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="8" height="16" rx="2"/><rect x="13" y="4" width="8" height="16" rx="2"/></svg><span class="badge hidden" id="prBadge" style="background:#fff">0</span></span>
      <span class="cap">Finished</span>
    </button>
  </div>
</div>

<!-- ================= SHEET ================= -->
<div id="sheetWrap" class="hidden"><div class="backdrop" id="sheetBack"></div><div class="sheet"><div class="grab"></div><div id="sheetBody"></div></div></div>

<!-- ================= RESULT ================= -->
<section id="result" class="view hidden">
  <div class="vhead">
    <button class="icon-btn" id="resClose" aria-label="Close"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="title">Before &amp; After</div>
    <button class="icon-btn" id="resDel" aria-label="Delete"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></button>
  </div>
  <div class="cmpArea" id="cmpArea">
    <div class="cmp" id="cmp"><canvas id="cmpA"></canvas><canvas id="cmpB"></canvas><div class="knobline" id="knobLine"></div><div class="knob" id="knob"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l-5 6 5 6M15 6l5 6-5 6"/></svg></div><span class="tag l glass">BEFORE</span><span class="tag r glass">AFTER</span></div>
    <img id="sideImg" class="hidden" alt="Share image">
  </div>
  <div class="seg"><button class="on" id="vSlider">Slider</button><button id="vSide">Share image</button></div>
  <div class="actions">
    <button class="btn pri" id="shareBtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 8l5-5 5 5M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg>Save &amp; share</button>
    <div class="btn2"><button class="btn sec" id="adjBtn">Adjust</button><button class="btn sec" id="retakeBtn">Retake after</button></div>
  </div>
</section>

<!-- ================= ADJUST ================= -->
<section id="adjust" class="view hidden">
  <div class="vhead">
    <button class="text-btn" id="adjCancel">Cancel</button>
    <div class="title">Adjust match</div>
    <button class="text-btn pri" id="adjDone">Done</button>
  </div>
  <div class="adjArea"><canvas id="adjCanvas"></canvas></div>
  <div class="adjCtl">
    <div class="ctl"><label>Match</label><input type="range" disabled style="opacity:0;pointer-events:none"><span class="v" id="adjScore">–</span></div>
    <div class="ctl"><label>Zoom</label><input type="range" id="adjZoom" min="80" max="125" step="0.5" value="100"><span class="v" id="adjZoomV">100%</span></div>
    <div class="ctl"><label>Rotate</label><input type="range" id="adjRot" min="-6" max="6" step="0.1" value="0"><span class="v" id="adjRotV">0°</span></div>
    <div class="ctl"><label>Ghost</label><input type="range" id="adjGhost" min="0" max="80" value="40"><span class="v" id="adjGhostV">40%</span></div>
    <div class="btn2"><button class="btn sec" id="adjAuto">Auto-match</button><button class="btn sec" id="adjReset">Reset</button></div>
  </div>
</section>

<div id="toast"></div>
<div id="busy" class="hidden"><div class="spinner"></div><span id="busyTxt">Matching…</span></div>

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const IOS=/iPad|iPhone|iPod/.test(navigator.userAgent);

/* =========================================================
   Image analysis (edges, matching)
   ========================================================= */
const AW=240; let AH=420;
const ID=()=>({dx:0,dy:0,s:1,r:0});
function mk(w,h){const c=document.createElement("canvas");c.width=Math.max(1,w|0);c.height=Math.max(1,h|0);return c;}
function coverCrop(sw,sh,a){ if(sw/sh>a){const cw=sh*a;return{x:(sw-cw)/2,y:0,w:cw,h:sh};} const ch=sw/a;return{x:0,y:(sh-ch)/2,w:sw,h:ch}; }
const _ctx={};
function ctxFor(w,h){const k=w+"x"+h;if(!_ctx[k]){_ctx[k]=mk(w,h).getContext("2d",{willReadFrequently:true});}return _ctx[k];}
function blur(g,w,h){
  const t=new Float32Array(g.length),o=new Float32Array(g.length);

// Gradient magnitude + raw gray of a source drawn at w x h
function sobel(src,crop,w,h,passes,wantGray){

    let minx=w,maxx=0,miny=h,maxy=0;

function onMotion(e){

  let ax=a.x,ay=a.y,az=a.z;if(IOS){ax=-ax;ay=-ay;az=-az;}
  if(Math.hypot(ax,ay,az)<3)return;
  const roll=Math.atan2(-ax,ay)*180/Math.PI;            // + = phone turned clockwise
  const pitch=Math.atan2(-az,Math.hypot(ax,ay))*180/Math.PI; // + = camera pointing up
  if(!SENS.ok){SENS.roll=roll;SENS.pitch=pitch;SENS.ok=true;return;}

const DB={db:null,mem:{befores:new Map(),pairs:new Map()},
  open(){return new Promise(res=>{try{const r=indexedDB.open("sb-lineup",1);
    r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains("befores"))d.createObjectStore("befores",{keyPath:"id"});if(!d.objectStoreNames.contains("pairs"))d.createObjectStore("pairs",{keyPath:"id"});};
    r.onsuccess=()=>{DB.db=r.result;res();};r.onerror=()=>res();}catch(_){res();}});},
  tx(store,mode,fn){return new Promise((res,rej)=>{if(!DB.db){res(fn(null));return;}try{const t=DB.db.transaction(store,mode);const st=t.objectStore(store);const out=fn(st);t.oncomplete=()=>res(out&&out.result!==undefined?out.result:out);t.onerror=()=>rej(t.error);}catch(e){rej(e);}});},
  async put(store,obj){if(!DB.db){DB.mem[store].set(obj.id,obj);return;}await DB.tx(store,"readwrite",st=>st.put(obj));},
  async del(store,id){if(!DB.db){DB.mem[store].delete(id);return;}await DB.tx(store,"readwrite",st=>st.delete(id));},
  async all(store){if(!DB.db)return[...DB.mem[store].values()];return new Promise((res)=>{const t=DB.db.transaction(store,"readonly");const r=t.objectStore(store).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>res([]);});},
  async get(store,id){if(!DB.db)return DB.mem[store].get(id);return new Promise((res)=>{const t=DB.db.transaction(store,"readonly");const r=t.objectStore(store).get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);});}
};

  if(n==="NotReadableError"||n==="AbortError")return "Another app is using the camera. Close it and try again.";

async function startCam(){

  camMsg("loading","Starting camera…");
  const tries=[{video:{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080}},audio:false},{video:{facingMode:"environment"},audio:false},{video:true,audio:false}];
  let st=null,err=null;
  for(const c of tries){try{st=await navigator.mediaDevices.getUserMedia(c);break;}catch(e){err=e;if(e.name==="NotAllowedError"||e.name==="SecurityError")break;}}
  if(!st){camMsg("error","Camera didn't open",camErr(err));return false;}
  S.stream=st;video.muted=true;video.setAttribute("playsinline","");video.srcObject=st;video.play().catch(()=>{});

    if(!(await waitVideo(4000))){stopCam();camMsg("error","No picture from the camera","Close other apps using the camera and reopen SB Lineup.");return false;}

// Find the main structure: bounding box of the strongest long edges (robust percentiles)

  const colC=new Uint32Array(AW),rowC=new Uint32Array(AH);let n=0;
  for(let y=0;y<AH;y++)for(let x=0;x<AW;x++)if(c[y*AW+x]){colC[x]++;rowC[y]++;n++;}
  if(n<40)return null;
  const pct=(arr,p)=>{let acc=0,t=p*n;for(let i=0;i<arr.length;i++){acc+=arr[i];if(acc>=t)return i;}return arr.length-1;};
  const x0=pct(colC,0.04),x1=pct(colC,0.96),y0=pct(rowC,0.04),y1=pct(rowC,0.96);
  return{x:x0/AW,y:y0/AH,w:Math.max(0.02,(x1-x0)/AW),h:Math.max(0.02,(y1-y0)/AH),n};
}
function analyzeBefore(){
  setAHForStage();

  const c=clean(thresh(m,AW,AH,0.08,null),AW,AH,Math.round(AW*0.12));
  S.lastClean=c;
  const auto=subjectBox(c);
  const box=S.lock||auto;
  // smooth the displayed box
  if(box){const p=S.subj;S.subj=p&&!S.lock?{x:p.x*.6+box.x*.4,y:p.y*.6+box.y*.4,w:p.w*.6+box.w*.4,h:p.h*.6+box.h*.4}:{...box};}else S.subj=null;
  // light
  let sum=0,br=0;const n=g.length;for(let i=0;i<n;i++){sum+=g[i];if(g[i]>247)br++;}
  const mean=sum/n,bright=br/n;
  let glare=0;
  if(S.subj){const b=S.subj,x0=(b.x*AW)|0,y0=(b.y*AH)|0,x1=Math.min(AW,((b.x+b.w)*AW)|0),y1=Math.min(AH,((b.y+b.h)*AH)|0);let k=0,t=0;
    for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){t++;if(g[y*AW+x]>247)k++;}glare=t?k/t:0;}
  const e=S.view.ema,a=0.35;
  S.view.ema=e?{mean:e.mean*(1-a)+mean*a,bright:e.bright*(1-a)+bright*a,glare:e.glare*(1-a)+glare*a}:{mean,bright,glare};
  const A=assessBefore();
  showAssessment(A);
  renderBrackets();
  if(S.sheet==="guide")renderGuide(A);

// Turn measurements into checks + one top suggestion
function assessBefore(){
  const L=S.view.ema||{mean:128,bright:0,glare:0};
  const issues=[];const chk={level:"none",frame:"good",light:"good"};const detail={};
  const roll=SENS.roll,pitch=SENS.pitch;
  if(SENS.ok){
    chk.level="good";
    if(Math.abs(roll)>40){issues.push({p:0,msg:"Hold the phone upright",k:"level"});chk.level="bad";}
    else if(Math.abs(roll)>1.5){const n=Math.round(Math.abs(roll));issues.push({p:1,msg:`Rotate ${roll>0?"left":"right"} ${n}° to level`,k:"level"});chk.level="warn";}
    if(pitch>12){issues.push({p:3,msg:`Pointing up ${Math.round(pitch)}°, step back`,k:"level"});if(chk.level==="good")chk.level="warn";}
    detail.level=Math.abs(roll)<=1.5?"Level.":`Tilted ${Math.round(Math.abs(roll))}° ${roll>0?"clockwise, rotate left":"counter-clockwise, rotate right"}.`;
    detail.tilt=pitch>12?`Camera points up ${Math.round(pitch)}°, so straight lines will lean. Step back and hold the phone straighter.`:
                pitch<-20?`Camera points down ${Math.round(-pitch)}°. Good for driveways, walkways and sills.`:"Straight on. Lines will stay straight.";
  }
  const b=S.subj;
  if(b){
    const L0=b.x<0.025,R0=b.x+b.w>0.975,T0=b.y<0.025,B0=b.y+b.h>0.975;
    let fmsg="",fd="Subject is centered and fully in the frame.";
    const cutL=L0&&b.x+b.w<0.88,cutR=R0&&b.x>0.12,cutT=T0&&b.y+b.h<0.88,cutB=B0&&b.y>0.12;
    if(cutL||cutR){fmsg=`Step back, cut off on the ${cutL?"left":"right"}`;fd=`The ${S.lock?"locked object":"main subject"} runs off the ${cutL?"left":"right"} edge.`;}
    else if(S.lock&&(cutT||cutB)){fmsg=`Step back, cut off at the ${cutT?"top":"bottom"}`;fd=`The locked object runs off the ${cutT?"top":"bottom"} edge.`;}
    else if(!S.lock&&b.w*b.h<0.07){fmsg="Step closer";fd="The subject is small in the frame. Get closer so the result is easy to see.";}
    else if(!S.lock&&!(L0&&R0)){const cx=b.x+b.w/2,cy=b.y+b.h/2;
      if(Math.abs(cx-0.5)>0.14){fmsg=`Aim a little ${cx<0.5?"left":"right"}`;fd="Center the subject so the after shot is easy to match.";}
      else if(Math.abs(cy-0.5)>0.17){fmsg=`Aim a little ${cy<0.5?"up":"down"}`;fd="Center the subject so the after shot is easy to match.";}}
    if(fmsg){issues.push({p:2,msg:fmsg,k:"frame"});chk.frame="warn";}
    detail.frame=fmsg?fd:(S.lock?"The locked object is fully in the frame.":fd);
  }else{chk.frame="none";detail.frame="Point the camera at the job.";}
  let ld="Lighting looks good.";
  if(L.mean<45){issues.push({p:4,msg:"Too dark, find more light",k:"light"});chk.light="warn";ld="The picture is very dark. Turn so the light is behind you, or come back in better light.";}
  else if(L.bright>0.4){issues.push({p:4,msg:"Very bright, sun in the shot?",k:"light"});chk.light="warn";ld="A large part of the picture is blown out. Turn so the sun is behind you.";}
  detail.light=ld;
  issues.sort((a,b)=>a.p-b.p);
  return{issues,chk,detail,good:issues.length===0&&!!b};
}
function analyzeAfter(){
  if(!S.fPts)return;
  const M=frameEdges(video,liveCrop());
  const sc=matchScore(M,ID());
  let b=search(M,24,3,[0.92,0.96,1,1.04,1.08],[0]);

  const tag=(t,X,Y)=>{x.font="800 "+fs+"px "+font;const tw=x.measureText(t).width;const p=fs*0.6;
    const bx=X+fs*.7,by=Y+fs*.7,bw2=tw+p*2,bh2=fs+p*1.3,r=bh2/2;
    x.fillStyle="rgba(11,15,20,.72)";x.beginPath();x.moveTo(bx+r,by);x.arcTo(bx+bw2,by,bx+bw2,by+bh2,r);x.arcTo(bx+bw2,by+bh2,bx,by+bh2,r);x.arcTo(bx,by+bh2,bx,by,r);x.arcTo(bx,by,bx+bw2,by,r);x.fill();
    x.fillStyle="#fff";x.textBaseline="middle";x.fillText(t,bx+p,by+bh2/2+1);};
  tag("BEFORE",0,0);tag("AFTER",ax,ay);
  const fy=oh-foot;x.fillStyle="#0b1f33";x.fillRect(0,fy,ow,foot);
  x.fillStyle="#00C2FF";x.fillRect(0,fy,ow,Math.max(3,foot*0.05));
  x.textBaseline="middle";x.fillStyle="#fff";x.font="700 "+Math.round(foot*0.36)+"px "+font;
  x.textAlign="left";x.fillText("Squeegee Bros Window Cleaning",foot*0.4,fy+foot*0.53);
  x.textAlign="right";x.font="600 "+Math.round(foot*0.3)+"px "+font;x.fillText("321-271-6465",ow-foot*0.4,fy+foot*0.53);
  x.textAlign="left";
  return{canvas:o,small:o,B,A};
}

/* =========================================================
   Result view
   ========================================================= */
let resultComp=null,cmpPos=50,sideUrl=null;
function showResult(comp){
  resultComp=comp;
  $("#result").classList.remove("hidden");
  const B=comp.B,A=comp.A;
  const cb=$("#cmpB"),ca=$("#cmpA");const k=Math.min(1,1100/Math.max(B.width,B.height));
  [cb,ca].forEach(c=>{c.width=Math.round(B.width*k);c.height=Math.round(B.height*k);});
  cb.getContext("2d").drawImage(B,0,0,cb.width,cb.height);ca.getContext("2d").drawImage(A,0,0,ca.width,ca.height);
  if(sideUrl)URL.revokeObjectURL(sideUrl);
  comp.canvas.toBlob(b=>{resultComp.blob=b;sideUrl=URL.createObjectURL(b);$("#sideImg").src=sideUrl;},"image/jpeg",0.92);
  setView("slider");layoutCmp();setCmp(50);
}
function layoutCmp(){
  const area=$("#cmpArea"),c=$("#cmp"),cb=$("#cmpB");if(!cb.width)return;
  const aw=area.clientWidth-28,ah=area.clientHeight-12,a=cb.width/cb.height;
  let w=aw,h=w/a;if(h>ah){h=ah;w=h*a;}
  c.style.width=w+"px";c.style.height=h+"px";
}
window.addEventListener("resize",()=>{if(!$("#result").classList.contains("hidden"))layoutCmp();});
function setCmp(v){cmpPos=Math.max(0,Math.min(100,v));$("#cmpB").style.clipPath=`inset(0 ${100-cmpPos}% 0 0)`;$("#knob").style.left=cmpPos+"%";$("#knobLine").style.left=cmpPos+"%";}
(function cmpDrag(){const c=$("#cmp");let on=false;
  const at=e=>{const r=c.getBoundingClientRect();setCmp((e.clientX-r.left)/r.width*100);};
  c.addEventListener("pointerdown",e=>{on=true;c.setPointerCapture(e.pointerId);at(e);});
  c.addEventListener("pointermove",e=>{if(on)at(e);});
  c.addEventListener("pointerup",()=>on=false);c.addEventListener("pointercancel",()=>on=false);})();
function setView(v){$("#vSlider").classList.toggle("on",v==="slider");$("#vSide").classList.toggle("on",v==="side");
  $("#cmp").classList.toggle("hidden",v!=="slider");$("#sideImg").classList.toggle("hidden",v!=="side");if(v==="slider")layoutCmp();}
$("#vSlider").onclick=()=>setView("slider");$("#vSide").onclick=()=>setView("side");
function closeResult(){$("#result").classList.add("hidden");enterBefore();startCam();}
$("#resClose").onclick=closeResult;
$("#resDel").onclick=async e=>{const b=e.currentTarget;
  if(!b.dataset.confirm){b.dataset.confirm="1";b.style.background="rgba(255,90,78,.25)";toast("Tap the trash again to delete");setTimeout(()=>{delete b.dataset.confirm;b.style.background="";},2500);return;}
  delete b.dataset.confirm;b.style.background="";
  if(S.pair){await DB.del("pairs",S.pair.id);await refreshLists();}
  toast("Deleted");closeResult();};
$("#retakeBtn").onclick=async()=>{
  if(!S.pair)return;
  const rec=S.pair.before;await DB.put("befores",rec);await DB.del("pairs",S.pair.id);await refreshLists();
  $("#result").classList.add("hidden");await enterAfter(rec);startCam();
};
async function sharePair(){
  const blob=resultComp&&resultComp.blob||(S.pair&&S.pair.composite);if(!blob)return;
  const stamp=new Date().toISOString().slice(0,16).replace(/[-:T]/g,"");
  const name="squeegee-bros-before-after-"+stamp+".jpg";
  if(window.SBAndroid&&window.SBAndroid.saveAndShare){
    const b64=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(String(fr.result).split(",")[1]);fr.readAsDataURL(blob);});
    window.SBAndroid.saveAndShare(b64,name);return;
  }
  const file=new File([blob],name,{type:"image/jpeg"});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file]});return;}catch(e){if(e&&e.name==="AbortError")return;}}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
}
$("#shareBtn").onclick=sharePair;
async function openPair(p){
  busy(true,"Opening…");
  try{
    const bi=await blobImg(p.beforeBlob),ai=await blobImg(p.afterBlob);
    S.W=bi.naturalWidth;S.H=bi.naturalHeight;
    const bc=mk(S.W,S.H);bc.getContext("2d").drawImage(bi,0,0);S.before=bc;
    const ac=mk(S.W,S.H);ac.getContext("2d").drawImage(ai,0,0,S.W,S.H);S.after=ac;
    AH=Math.max(60,Math.round(AW*S.H/S.W));S.T={...p.T};S.roi=p.roi||null;S.cur=p.before;S.pair=p;S.mA=null;S.aDil=null;
    stopCam();showResult(compose());
  }finally{busy(false);}
}

/* =========================================================
   Adjust view
   ========================================================= */
let adjSaved=null,adjOl=true;
function ensureAnalysis(){
  if(!S.mA){S.mA=sobel(S.before,null,AW,AH,1);const ow=Math.min(480,S.W),oh=Math.round(ow*S.H/S.W);S.oW=ow;S.oH=oh;S.mD=sobel(S.before,null,ow,oh,1);computeFocus();}
  if(!S.aDil)S.aDil=frameEdges(S.after,null);
}
function openAdjust(){
  ensureAnalysis();adjSaved={...S.T};
  $("#adjust").classList.remove("hidden");
  const c=$("#adjCanvas"),k=Math.min(1,900/Math.max(S.W,S.H));c.width=Math.round(S.W*k);c.height=Math.round(S.H*k);
  syncAdj();renderAdj();
}
function syncAdj(){const z=100/S.T.s,r=-S.T.r*180/Math.PI;$("#adjZoom").value=z.toFixed(1);$("#adjRot").value=r.toFixed(1);$("#adjZoomV").textContent=Math.round(z)+"%";$("#adjRotV").textContent=r.toFixed(1)+"°";}
function renderAdj(){
  const c=$("#adjCanvas"),x=c.getContext("2d");drawAligned(x,c.width,c.height);
  const g=$("#adjGhost").value/100;$("#adjGhostV").textContent=Math.round(g*100)+"%";
  if(g>0){x.globalAlpha=g;x.drawImage(S.before,0,0,c.width,c.height);x.globalAlpha=1;}
  x.save();x.shadowColor="#000";x.shadowBlur=2;x.drawImage(S.outline,0,0,c.width,c.height);x.restore();
  $("#adjScore").textContent=matchScore(S.aDil,S.T)+"%";
}
(function adjDrag(){const c=$("#adjCanvas");let last=null;
  c.addEventListener("pointerdown",e=>{last={x:e.clientX,y:e.clientY};c.setPointerCapture(e.pointerId);});
  c.addEventListener("pointermove",e=>{if(!last)return;const k=AW/c.clientWidth*S.T.s;S.T.dx-=(e.clientX-last.x)*k;S.T.dy-=(e.clientY-last.y)*k;last={x:e.clientX,y:e.clientY};renderAdj();});
  const end=()=>last=null;c.addEventListener("pointerup",end);c.addEventListener("pointercancel",end);})();
$("#adjZoom").oninput=e=>{S.T.s=100/e.target.value;$("#adjZoomV").textContent=Math.round(e.target.value)+"%";renderAdj();};
$("#adjRot").oninput=e=>{S.T.r=-e.target.value*Math.PI/180;$("#adjRotV").textContent=(+e.target.value).toFixed(1)+"°";renderAdj();};
$("#adjGhost").oninput=renderAdj;
$("#adjAuto").onclick=()=>{busy(true,"Matching…");setTimeout(()=>{autoAlign(false);syncAdj();renderAdj();busy(false);},30);};
$("#adjReset").onclick=()=>{S.T=ID();syncAdj();renderAdj();};
$("#adjCancel").onclick=()=>{S.T=adjSaved;$("#adjust").classList.add("hidden");};
$("#adjDone").onclick=async()=>{
  busy(true,"Saving…");
  try{const comp=compose();
    if(S.pair){S.pair.T={...S.T};S.pair.composite=await canvasBlob(comp.canvas,0.92);S.pair.thumb=thumbOf(comp.canvas,260);await DB.put("pairs",S.pair);await refreshLists();}
    $("#adjust").classList.add("hidden");showResult(comp);}finally{busy(false);}
};
$("#adjBtn").onclick=openAdjust;

   Wiring
   ========================================================= */
$("#shutter").onclick=onShutter;
$("#pill").onclick=()=>{askMotion();openSheet("guide");};
$("#mBefore").onclick=()=>{if(S.mode!=="before")enterBefore();};
$("#mAfter").onclick=()=>{if(S.mode==="after")return;if(!befores.length){toast("Take a before photo first");return;}
  if(befores.length===1)enterAfter(befores[0]);else openSheet("pick");};
$("#stackBtn").onclick=()=>{if(!befores.length&&S.mode==="before"){toast("Before photos waiting for an after show up here");return;}openSheet("pick");};
$("#pairsBtn").onclick=()=>openSheet("pairs");
$("#lockChip").onclick=e=>{e.stopPropagation();S.lock=null;setModeUI();};
$("#ghostBtn").onclick=e=>{e.stopPropagation();const steps=[0,0.3,0.6];S.ghost=steps[(steps.indexOf(S.ghost)+1)%steps.length];$("#ghost").style.opacity=S.ghost;$("#ghostPct").textContent=Math.round(S.ghost*100)+"%";};

// Tap on the camera to lock onto an object (before mode)
function lockAt(tx,ty){
  setAHForStage();
  const c=S.lastClean;let box=null;
  if(c&&c.length===AW*AH){
    const px=tx*AW,py=ty*AH;
    const rx0=Math.max(0,Math.round(px-AW*0.26)),rx1=Math.min(AW,Math.round(px+AW*0.26)),ry0=Math.max(0,Math.round(py-AH*0.17)),ry1=Math.min(AH,Math.round(py+AH*0.17));
    const lab=new Int32Array(AW*AH),stack=new Int32Array(AW*AH),comps=[];let id=0;
    for(let y=ry0;y<ry1;y++)for(let x=rx0;x<rx1;x++){const i=y*AW+x;if(!c[i]||lab[i])continue;
      id++;let sp=0,n=0,x0=AW,x1=0,y0=AH,y1=0,dmin=1e9;stack[sp++]=i;lab[i]=id;
      while(sp){const j=stack[--sp];n++;const X=j%AW,Y=(j/AW)|0;if(X<x0)x0=X;if(X>x1)x1=X;if(Y<y0)y0=Y;if(Y>y1)y1=Y;const d=(X-px)*(X-px)+(Y-py)*(Y-py);if(d<dmin)dmin=d;
        for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const XX=X+dx,YY=Y+dy;if(XX<rx0||XX>=rx1||YY<ry0||YY>=ry1)continue;const k=YY*AW+XX;if(c[k]&&!lab[k]){lab[k]=id;stack[sp++]=k;}}}
      if(n>=8)comps.push({x0,x1,y0,y1,n,d:Math.sqrt(dmin),area:(x1-x0+1)*(y1-y0+1)});}
    const inside=comps.filter(k=>px>=k.x0-3&&px<=k.x1+3&&py>=k.y0-3&&py<=k.y1+3).sort((a,b)=>a.area-b.area);
    let pick=inside[0]||comps.filter(k=>k.d<AW*0.08).sort((a,b)=>a.d-b.d)[0];
    if(pick){
      let u={...pick};const ex=AW*0.04;
      for(const k of comps){if(k===pick)continue;
        if(k.x0<=u.x1+ex&&k.x1>=u.x0-ex&&k.y0<=u.y1+ex&&k.y1>=u.y0-ex&&k.area<=u.area*4){u.x0=Math.min(u.x0,k.x0);u.x1=Math.max(u.x1,k.x1);u.y0=Math.min(u.y0,k.y0);u.y1=Math.max(u.y1,k.y1);}}
      const w=(u.x1-u.x0+1)/AW,h=(u.y1-u.y0+1)/AH;
      box={x:u.x0/AW-w*0.08,y:u.y0/AH-Math.max(h*0.1,0.015),w:w*1.16,h:h*1.2+0.03};
    }
  }
  if(!box)box={x:tx-0.2,y:ty-0.12,w:0.4,h:0.24};
  box.w=Math.max(0.1,Math.min(1,box.w));box.h=Math.max(0.06,Math.min(1,box.h));
  box.x=Math.max(0,Math.min(1-box.w,box.x));box.y=Math.max(0,Math.min(1-box.h,box.y));
  return box;
}
stage.addEventListener("click",e=>{
  askMotion();
  if(S.mode!=="before"||!S.stream||e.target.closest("button"))return;
  const r=stage.getBoundingClientRect();
  const box=lockAt((e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height);
  S.lock=box;S.subj={...box};buzz(15);setModeUI();renderBrackets();
});

// Fallback: photo from the phone's own camera app
$("#fileIn").addEventListener("change",async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  const img=await blobImg(f);
  if(S.mode==="before"){const a=stageAspect(),cr=coverCrop(img.naturalWidth,img.naturalHeight,a);const k=Math.min(1,1600/Math.max(cr.w,cr.h));
    const c=mk(cr.w*k,cr.h*k);c.getContext("2d").drawImage(img,cr.x,cr.y,cr.w,cr.h,0,0,c.width,c.height);await saveBefore(c,false);}
  else await finishAfter(img,img.naturalWidth,img.naturalHeight,false);
});

// Android back button
window.sbBack=function(){
  if(!$("#busy").classList.contains("hidden"))return true;
  if(S.sheet){closeSheet();return true;}
  if(!$("#adjust").classList.contains("hidden")){$("#adjCancel").click();return true;}
  if(!$("#result").classList.contains("hidden")){closeResult();return true;}

};
